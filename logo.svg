<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="30%" stop-color="#c9953a"/>
      <stop offset="60%" stop-color="#b8863a"/>
      <stop offset="100%" stop-color="#a07332"/>
    </linearGradient>
    <radialGradient id="lens" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#b8863a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8a6428" stop-opacity="0.14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="100" cy="80" rx="90" ry="70" fill="url(#glow)"/>

  <!-- Camera body -->
  <rect x="22" y="42" width="156" height="78" rx="10"
        stroke="url(#gold)" stroke-width="2.8" fill="none"/>
  <!-- Inner bezel -->
  <rect x="26" y="46" width="148" height="70" rx="7"
        stroke="url(#gold)" stroke-width="0.6" fill="none" opacity="0.12"/>

  <!-- Viewfinder bump -->
  <rect x="62" y="26" width="76" height="18" rx="6"
        stroke="url(#gold)" stroke-width="2.2" fill="none"/>
  <rect x="68" y="30" width="64" height="10" rx="4"
        fill="url(#gold)" opacity="0.05"/>

  <!-- Lens — concentric rings -->
  <circle cx="100" cy="81" r="28" stroke="url(#gold)" stroke-width="2.8"/>
  <circle cx="100" cy="81" r="23" stroke="url(#gold)" stroke-width="1.4"/>
  <circle cx="100" cy="81" r="18" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
  <circle cx="100" cy="81" r="13" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="81" r="8" stroke="url(#gold)" stroke-width="0.3" opacity="0.2"/>
  <!-- Lens fill -->
  <circle cx="100" cy="81" r="28" fill="url(#lens)"/>
  <!-- Center dot -->
  <circle cx="100" cy="81" r="4" fill="url(#gold)" opacity="0.15"/>
  <!-- Glass highlights -->
  <ellipse cx="92" cy="74" rx="6" ry="5" fill="white" opacity="0.07"/>
  <circle cx="90" cy="72" r="2.5" fill="white" opacity="0.1"/>

  <!-- Shutter button -->
  <rect x="166" y="52" width="12" height="10" rx="5"
        stroke="url(#gold)" stroke-width="1.4" fill="url(#gold)" fill-opacity="0.08"/>

  <!-- Mode dial -->
  <circle cx="38" cy="57" r="8" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="38" y1="49" x2="38" y2="52" stroke="url(#gold)" stroke-width="1"/>
  <line x1="38" y1="62" x2="38" y2="65" stroke="url(#gold)" stroke-width="1"/>
  <line x1="30" y1="57" x2="33" y2="57" stroke="url(#gold)" stroke-width="1"/>
  <line x1="43" y1="57" x2="46" y2="57" stroke="url(#gold)" stroke-width="1"/>
  <circle cx="38" cy="57" r="3" fill="url(#gold)" opacity="0.06"/>

  <!-- Grip texture -->
  <line x1="26" y1="66" x2="26" y2="104" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
  <line x1="29" y1="66" x2="29" y2="104" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
  <line x1="32" y1="66" x2="32" y2="104" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
  <line x1="35" y1="66" x2="35" y2="104" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>

  <!-- Hot shoe rail -->
  <rect x="86" y="23" width="28" height="3.5" rx="1.8" fill="url(#gold)" opacity="0.12"/>
</svg>
